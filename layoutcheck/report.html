<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MigLayout Layout Check</title>
<style>
:root {
	--bg: #f5f6f8; --panel: #ffffff; --fg: #1a2130; --muted: #5b6577; --line: #dce0e7; --accent: #2b59cf; --on-accent: #ffffff;
	--same: #23895a; --same-bg: #e1f3ea; --bad: #c92a35; --bad-bg: #fbe4e6; --warn: #a8670a; --warn-bg: #fbefd9;
	--err: #7429bd; --err-bg: #eee2fa; --noise: #677184; --noise-bg: #eceef2; --shot: #e8eaee;
	--sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
	--mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
	--bg: #111419; --panel: #191d24; --fg: #e3e7ee; --muted: #97a1b2; --line: #2b313c; --accent: #7d9bff; --on-accent: #0d1222;
	--same: #4cc38a; --same-bg: #15301f; --bad: #ff6b74; --bad-bg: #3b1b1f; --warn: #f0ac3c; --warn-bg: #3a2c12;
	--err: #c08cff; --err-bg: #2c1f40; --noise: #a3acbb; --noise-bg: #252a33; --shot: #232831; color-scheme: dark } }
:root[data-theme="dark"] {
	--bg: #111419; --panel: #191d24; --fg: #e3e7ee; --muted: #97a1b2; --line: #2b313c; --accent: #7d9bff; --on-accent: #0d1222;
	--same: #4cc38a; --same-bg: #15301f; --bad: #ff6b74; --bad-bg: #3b1b1f; --warn: #f0ac3c; --warn-bg: #3a2c12;
	--err: #c08cff; --err-bg: #2c1f40; --noise: #a3acbb; --noise-bg: #252a33; --shot: #232831; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans) }
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 24px 64px;
	padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
	display: grid; gap: 20px }
h1 { font-size: 1.55rem; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font-size: 1.05rem; margin: 0; text-wrap: balance }
code, .mono { font-family: var(--mono); font-size: 0.88em }
.muted { color: var(--muted) }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted) }

/* Summary */
.builds { display: grid; gap: 4px }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px }
.verdict { display: grid; gap: 8px; align-content: start; padding: 16px 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--noise) }
.verdict.ok { border-top-color: var(--same) }
.verdict.bad { border-top-color: var(--bad) }
.verdict .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.verdict .name { font-weight: 650; font-size: 1rem }
.verdict .big { font-size: 1.6rem; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums }
.verdict.ok .big { color: var(--same) } .verdict.bad .big { color: var(--bad) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; font-variant-numeric: tabular-nums }
.s-same { background: var(--same-bg); color: var(--same) }
.s-layout, .s-missing { background: var(--bad-bg); color: var(--bad) }
.s-pixels, .s-sizes { background: var(--warn-bg); color: var(--warn) }
.s-error { background: var(--err-bg); color: var(--err) }
.s-noise { background: var(--noise-bg); color: var(--noise) }
pre.err { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--err-bg); padding: 8px 10px; border-radius: 6px; max-height: 260px; overflow: auto; margin: 0 }

/* Overview */
.scroll { overflow-x: auto; max-width: 100% }
table.grid { border-collapse: collapse; font-variant-numeric: tabular-nums }
.grid th, .grid td { padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap }
.grid th { font-size: 12px; font-weight: 550; color: var(--muted) }
.grid th:first-child, .grid td:first-child { text-align: left }
.grid button { border: 0; border-radius: 6px; padding: 3px 10px; min-width: 64px; font: 600 12px var(--sans); cursor: pointer }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end }
.controls label { display: grid; gap: 3px }
select, input[type=search] { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); max-width: 100% }
input[type=search] { width: 200px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel) }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--fg); padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap }
.seg button:last-child { border-right: 0 }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent) }
.seg.small button { padding: 2px 9px; font-size: 12px }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between }
.pager { display: flex; gap: 6px; align-items: center }
.pager button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.pager button:disabled { opacity: 0.4; cursor: default }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--same-bg); color: var(--fg); border: 1px solid var(--line) }

/* Snapshot cards */
.cards { display: grid; gap: 14px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; border-left: 4px solid var(--line) }
.card.c-same { border-left-color: var(--same) } .card.c-layout, .card.c-missing { border-left-color: var(--bad) }
.card.c-pixels, .card.c-sizes { border-left-color: var(--warn) } .card.c-error { border-left-color: var(--err) } .card.c-noise { border-left-color: var(--noise) }
.card-head { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: baseline; justify-content: space-between }
.card-title { display: grid; gap: 1px; min-width: 0 }
.card-title b { font-size: 15px }
.where { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere }
.stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px }
.shots { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start }
.shot { display: grid; gap: 4px; min-width: 0; max-width: 100% }
.shot .label { display: flex; gap: 6px }
.frame { overflow: auto; max-width: 100%; max-height: 80vh; background: var(--shot); border: 1px solid var(--line); border-radius: 4px; line-height: 0 }
.frame img { display: block; max-width: none; image-rendering: pixelated }
.frame .missing { line-height: 1.5; padding: 12px; color: var(--muted); font-size: 13px }
.delta img { filter: url(#amp) }
details.comps summary { cursor: pointer; color: var(--muted); font-size: 13px }
table.diffs { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 6px }
.diffs th, .diffs td { border-bottom: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top }
.diffs td.mono { white-space: nowrap }
.empty { padding: 24px; text-align: center; color: var(--muted) }
footer { font-size: 12px; color: var(--muted) }
@media (max-width: 600px) { input[type=search] { width: 100% } .controls label { flex: 1 1 140px } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<!-- Brightens the delta images: each channel times the factor, in sRGB, clamped to 255. -->
	<filter id="amp" color-interpolation-filters="sRGB"><feComponentTransfer>
		<feFuncR type="linear" slope="1"/><feFuncG type="linear" slope="1"/><feFuncB type="linear" slope="1"/>
	</feComponentTransfer></filter>
</svg>
<div class="wrap">
	<header style="display:grid;gap:8px">
		<div class="label">MigLayout layout check</div>
		<h1 id="title"></h1>
		<div class="builds muted" id="builds"></div>
	</header>

	<section class="summary" id="summary" aria-label="Summary"></section>

	<section class="panel" id="overview" style="display:grid;gap:10px"></section>

	<section style="display:grid;gap:12px" aria-label="Snapshots">
		<div class="panel" style="display:grid;gap:12px">
			<div style="display:grid;gap:2px">
				<h2>Snapshots</h2>
				<div class="muted">Every step of every GUI, as the base build and the candidate drew it. The delta is |base − candidate| per colour channel: black where the two are identical.</div>
			</div>
			<div class="controls">
				<label><span class="label">Candidate</span><select id="f-cand"></select></label>
				<label><span class="label">Show</span><select id="f-show">
					<option value="diff">differences</option>
					<option value="noise">noise</option>
					<option value="all">everything</option>
				</select></label>
				<label><span class="label">JDK / config</span><select id="f-cfg"></select></label>
				<label><span class="label">Look and feel</span><select id="f-laf"></select></label>
				<label><span class="label">Group</span><select id="f-group"></select></label>
				<label><span class="label">Search</span><input type="search" id="f-q" placeholder="scenario or step"></label>
			</div>
			<div class="controls">
				<div style="display:grid;gap:3px"><span class="label">View</span><div class="seg" id="v-mode"></div></div>
				<div style="display:grid;gap:3px"><span class="label">Delta brightness</span><div class="seg" id="v-amp"></div></div>
				<div style="display:grid;gap:3px"><span class="label">Zoom</span><div class="seg" id="v-zoom"></div></div>
			</div>
		</div>
		<div id="banner"></div>
		<div class="bar"><div class="muted" id="count"></div><div class="pager" id="pager-top"></div></div>
		<div class="cards" id="cards"></div>
		<div class="bar"><div></div><div class="pager" id="pager-bottom"></div></div>
	</section>

	<section class="panel" id="probe" hidden></section>
	<footer id="footer"></footer>
</div>

<script src="data.js"></script>
<script>
"use strict";
const R = window.REPORT, M = R.meta, BASE = M.base, AGAIN = BASE + "~again";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"}[c]));
const num = n => Number(n).toLocaleString("en");
const STATUS = {s: "same", n: "noise", p: "pixels", z: "sizes", l: "layout", m: "missing", e: "error"};
const RANK = {same: 0, noise: 1, pixels: 2, sizes: 3, layout: 4, missing: 5, error: 6};
const LABEL = {same: "identical", noise: "noise", pixels: "pixels differ", sizes: "container sizes differ",
	layout: "bounds differ", missing: "step missing", error: "error"};
const DIFFERENT = ["pixels", "sizes", "layout", "missing", "error"];
const PAGE = 20;
const store = {
	get(k, d) { try { return localStorage.getItem("layout-check." + k) ?? d } catch { return d } },
	set(k, v) { try { localStorage.setItem("layout-check." + k, v) } catch {} }
};
const plural = (n, word) => `${num(n)} ${word}${n === 1 ? "" : "s"}`;
const name = c => c === AGAIN ? BASE + " (again)" : c;
const cfgKeys = [...new Set(R.combos.map(([j, c]) => j + " / " + c))];
const groups = [...new Set(R.scenarios.map(s => s.group || "Other"))];
const differs = c => DIFFERENT.reduce((n, k) => n + (R.totals[c][k] || 0), 0);
const real = R.candidates.filter(c => c !== AGAIN);

// ---------------------------------------------------------------- header and summary
$("#title").textContent = real.length === 1 ? `${name(real[0])} compared with ${BASE}` : `${real.length} builds compared with ${BASE}`;
$("#builds").innerHTML = Object.entries(M.builds).map(([n, b]) =>
	`<div><b>${esc(n)}</b>${n === BASE ? " <span class=\"chip s-noise\">base</span>" : ""} <span class="mono">${esc(b.subject || b.description || "")}</span>${b.ref && !(b.subject || "").startsWith(b.ref) ? ` <span class="muted">(${esc(b.ref)})</span>` : ""}</div>`).join("") +
	`<div>${plural(R.scenarios.length, "GUI")} · ${plural(M.lafs.length, "look and feel")} · ${plural(Object.keys(M.configs).length, "JVM config")} · ${plural(Object.keys(M.jdks).length, "JDK")}` +
	`${M.only ? ` · only <code>${esc(M.only)}</code>` : ""} · ${esc(M.finished || M.started || "")}</div>`;

function totalSteps(c) { return Object.values(R.totals[c]).reduce((a, b) => a + b, 0) }
$("#summary").innerHTML = R.candidates.map(c => {
	const t = R.totals[c], n = totalSteps(c), bad = differs(c), again = c === AGAIN;
	const chips = Object.keys(LABEL).filter(k => t[k]).map(k => `<span class="chip s-${k}">${num(t[k])} ${LABEL[k]}</span>`).join("");
	if (again) return `<div class="verdict">
		<div class="head"><span class="name">Noise floor</span><span class="muted">${esc(BASE)} against itself</span></div>
		<div class="big" style="color:var(--fg)">${bad ? `${num(bad)} of ${num(n)} steps vary` : "Deterministic"}</div>
		<div class="muted">The base build ran twice. ${bad ? "Where its two runs differ, a candidate's differences are checked again before they count, and are noise if the base build gives them too." : "Both runs were identical in every step."}</div>
		<div class="chips">${chips}</div></div>`;
	return `<div class="verdict ${bad ? "bad" : "ok"}">
		<div class="head"><span class="name">${esc(c)}</span><span class="mono muted">${esc(M.builds[c]?.subject || "")}</span></div>
		<div class="big">${bad ? `${num(bad)} of ${num(n)} steps differ` : "No differences"}</div>
		<div class="muted">${bad ? `Steps whose bounds, container sizes, errors or pixels differ from ${esc(BASE)}.` : ""}
			${t.same ? `${num(t.same)} steps have the same bounds, container sizes, errors and pixels as ${esc(BASE)}.` : ""}
			${t.noise ? `${num(t.noise)} steps differ, but ${esc(BASE)} gives the same results when it runs again; they count as noise. Show “noise” below to check them.` : ""}</div>
		<div class="chips">${chips}</div></div>`;
}).join("") + (M.failures?.length ? `<div class="verdict bad"><div class="name">${M.failures.length} JVMs failed</div>
	<div class="muted">Their GUIs are missing from the comparison.</div><pre class="err">${esc(M.failures.join("\n\n"))}</pre></div>` : "");

// ---------------------------------------------------------------- filters and view state
const f = {cand: $("#f-cand"), show: $("#f-show"), cfg: $("#f-cfg"), laf: $("#f-laf"), group: $("#f-group"), q: $("#f-q")};
f.cand.innerHTML = R.candidates.map(c => `<option value="${esc(c)}">${esc(name(c))}</option>`).join("");
f.cfg.innerHTML = `<option value="">all</option>` + cfgKeys.map(k => `<option>${esc(k)}</option>`).join("");
f.laf.innerHTML = `<option value="">all</option>` + M.lafs.map(l => `<option>${esc(l)}</option>`).join("");
f.group.innerHTML = `<option value="">all</option>` + groups.map(g => `<option>${esc(g)}</option>`).join("");
f.cand.value = R.candidates[0];
f.show.value = differs(f.cand.value) ? "diff" : "all";

const view = {mode: store.get("mode", "side"), amp: store.get("amp", "255"), zoom: store.get("zoom", "1")};
const perCard = {};  // a card's own view, chosen with its buttons
let page = 0;

function seg(el, key, options) {
	el.innerHTML = options.map(([v, l, t]) => `<button data-v="${v}" aria-pressed="${view[key] === v}"${t ? ` title="${esc(t)}"` : ""}>${l}</button>`).join("");
	el.onclick = e => {
		const b = e.target.closest("button"); if (!b) return;
		view[key] = b.dataset.v; store.set(key, view[key]);
		if (key === "mode") for (const k in perCard) delete perCard[k];
		seg(el, key, options); applyAmp(); renderCards();
	};
}
const MODES = [["side", "Side by side"], ["delta", "Delta |a−b|"], ["blink", "Blink"]];
seg($("#v-mode"), "mode", MODES);
seg($("#v-amp"), "amp", [["1", "Exact", "The delta as it is: a difference of 1 in a channel is almost black"],
	["16", "×16", "Each channel times 16"], ["255", "Any change", "Each channel times 255: every pixel that differs at all is bright"]]);
seg($("#v-zoom"), "zoom", [["1", "1×"], ["2", "2×"], ["4", "4×"]]);
function applyAmp() { document.querySelectorAll("#amp feFuncR, #amp feFuncG, #amp feFuncB").forEach(n => n.setAttribute("slope", view.amp)) }
applyAmp();

for (const el of Object.values(f)) el.addEventListener(el === f.q ? "input" : "change", () => {
	page = 0;
	if (el === f.cand) { f.show.value = differs(f.cand.value) ? "diff" : "all"; renderOverview() }
	renderCards();
});

// ---------------------------------------------------------------- overview: where a candidate differs
function renderOverview() {
	const c = f.cand.value, counts = {};
	R.combos.forEach(([jdk, cfg, laf], ci) => {
		const k = jdk + " / " + cfg;
		const row = counts[k] ||= {};
		const cell = row[laf] ||= {bad: 0, noise: 0, n: 0};
		for (const codes of R.status[c][ci]) for (const ch of codes) {
			const st = STATUS[ch]; cell.n++;
			if (DIFFERENT.includes(st)) cell.bad++; else if (st === "noise") cell.noise++;
		}
	});
	$("#overview").innerHTML = `<div style="display:grid;gap:2px"><h2>Where ${esc(name(c))} differs</h2>
		<div class="muted">Steps that differ from ${esc(BASE)}, per JVM configuration and look and feel. A cell shows them below.</div></div>
		<div class="scroll"><table class="grid"><thead><tr><th>JDK / config</th>${M.lafs.map(l => `<th>${esc(l)}</th>`).join("")}</tr></thead><tbody>` +
		Object.entries(counts).map(([k, row]) => `<tr><td class="mono">${esc(k)}</td>${M.lafs.map(l => {
			const x = row[l] || {bad: 0, noise: 0, n: 0};
			const cls = x.bad ? "s-layout" : x.noise ? "s-noise" : "s-same";
			const txt = x.bad ? num(x.bad) : x.noise ? `${num(x.noise)} noise` : "✓";
			return `<td><button class="${cls}" data-cfg="${esc(k)}" data-laf="${esc(l)}" title="${num(x.n)} steps: ${num(x.bad)} differ, ${num(x.noise)} noise">${txt}</button></td>`;
		}).join("")}</tr>`).join("") + `</tbody></table></div>`;
}
$("#overview").addEventListener("click", e => {
	const b = e.target.closest("button[data-cfg]"); if (!b) return;
	f.cfg.value = b.dataset.cfg; f.laf.value = b.dataset.laf;
	f.show.value = b.classList.contains("s-layout") ? "diff" : b.classList.contains("s-noise") ? "noise" : "all";
	page = 0; renderCards();
	$("#cards").scrollIntoView({behavior: "smooth", block: "start"});
});

// ---------------------------------------------------------------- snapshot list
function items() {
	const c = f.cand.value, show = f.show.value, q = f.q.value.trim().toLowerCase();
	const list = [];
	R.combos.forEach(([jdk, cfg, laf], ci) => {
		if (f.cfg.value && f.cfg.value !== jdk + " / " + cfg) return;
		if (f.laf.value && f.laf.value !== laf) return;
		R.status[c][ci].forEach((codes, si) => {
			const s = R.scenarios[si];
			if (f.group.value && f.group.value !== (s.group || "Other")) return;
			for (let i = 0; i < codes.length; i++) {
				const st = STATUS[codes[i]];
				if (show === "diff" && !DIFFERENT.includes(st)) continue;
				if (show === "noise" && st !== "noise") continue;
				if (q && !`${s.id} ${s.title} ${s.steps[i] || ""}`.toLowerCase().includes(q)) continue;
				list.push({ci, si, i, st});
			}
		});
	});
	if (show === "diff") list.sort((a, b) => RANK[b.st] - RANK[a.st]);
	return list;
}

const seg2 = n => String(n).padStart(2, "0");
const path = (...parts) => parts.map(encodeURIComponent).join("/");
function urls(it) {
	const [jdk, cfg, laf] = R.combos[it.ci], sid = R.scenarios[it.si].id, c = f.cand.value, file = seg2(it.i) + ".png";
	return {base: path("results", jdk, cfg, BASE, laf, sid, file), cand: path("results", jdk, cfg, c, laf, sid, file),
		delta: path("deltas", jdk, cfg, c, laf, sid, file)};
}
function img(src, alt) {
	return `<img src="${esc(src)}" alt="${esc(alt)}" data-zoom onerror="this.outerHTML='<div class=missing>No screenshot</div>'">`;
}
function shot(label, src, alt, cls = "") {
	return `<div class="shot"><div class="label">${label}</div><div class="frame ${cls}">${img(src, alt)}</div></div>`;
}

function renderCards() {
	const list = items(), c = f.cand.value, pages = Math.max(1, Math.ceil(list.length / PAGE));
	page = Math.min(page, pages - 1);
	const shown = list.slice(page * PAGE, page * PAGE + PAGE);
	$("#count").textContent = list.length ? `${num(page * PAGE + 1)}–${num(page * PAGE + shown.length)} of ${num(list.length)} snapshots` : "";
	const bad = differs(c);
	$("#banner").innerHTML = f.show.value === "diff" && !bad
		? `<div class="banner"><b>Nothing differs.</b> Choose “everything” under Show to browse all ${num(totalSteps(c))} snapshots: every delta is black.</div>` : "";
	for (const id of ["#pager-top", "#pager-bottom"]) $(id).innerHTML = pages > 1
		? `<button data-p="${page - 1}" ${page ? "" : "disabled"}>‹ Previous</button><span class="muted">page ${page + 1} of ${num(pages)}</span><button data-p="${page + 1}" ${page < pages - 1 ? "" : "disabled"}>Next ›</button>` : "";
	$("#cards").innerHTML = shown.length ? shown.map(card).join("") : `<div class="panel empty">No snapshot matches these filters.</div>`;
	$("#cards").querySelectorAll("img[data-zoom]").forEach(zoomed);
	startBlink();
}
for (const id of ["#pager-top", "#pager-bottom"]) $(id).addEventListener("click", e => {
	const b = e.target.closest("button[data-p]"); if (!b || b.disabled) return;
	page = +b.dataset.p; renderCards();
	$("#count").scrollIntoView({block: "start"});
});

function zoomed(im) {
	// On every load: blinking swaps the source, and the two screenshots may differ in size.
	const set = () => { im.style.width = im.naturalWidth * +view.zoom + "px" };
	im.addEventListener("load", set);
	if (im.complete && im.naturalWidth) set();
}

function card(it) {
	const s = R.scenarios[it.si], [jdk, cfg, laf] = R.combos[it.ci], c = f.cand.value;
	const key = `${c}|${it.ci}|${it.si}|${it.i}`, d = R.details[key] || {}, u = urls(it);
	const mode = perCard[key] || view.mode, cn = esc(name(c)), pix = d.pixels;
	let stats = `<span class="chip s-${it.st}">${LABEL[it.st]}</span>`;
	if (pix) stats += pix.sizes ? `<span>screenshot ${pix.sizes[0].join("×")} → ${pix.sizes[1].join("×")}</span>`
		: `<span>${num(pix.count)} pixels differ · largest channel delta ${pix.max} · x ${pix.box[0]}–${pix.box[2]}, y ${pix.box[1]}–${pix.box[3]}</span>`;
	else if (it.st === "same" || it.st === "noise" && !d.comps) stats += `<span class="muted">0 pixels differ</span>`;
	let body;
	if (mode === "delta") body = `<div class="shots">${shot(`Delta |${esc(BASE)} − ${cn}|${view.amp !== "1" ? ` · ×${view.amp}` : ""}`, u.delta, "delta", "delta")}</div>`;
	else if (mode === "blink") body = `<div class="shots"><div class="shot"><div class="label"><span class="blinkcap">${esc(BASE)}</span></div><div class="frame blink" data-a="${esc(u.base)}" data-b="${esc(u.cand)}" data-an="${esc(BASE)}" data-bn="${cn}">${img(u.base, "blinking between both builds")}</div></div></div>`;
	else body = `<div class="shots">${shot(esc(BASE), u.base, "base")}${shot(cn, u.cand, "candidate")}</div>`;
	let extra = "";
	if (d.note) extra += `<div class="muted">${esc(d.note)}</div>`;
	if (d.comps?.length) extra += `<details class="comps"${d.comps.length <= 12 ? " open" : ""}><summary>${num(d.comps.length)} component difference${d.comps.length > 1 ? "s" : ""}</summary><div class="scroll"><table class="diffs">
		<thead><tr><th>Component</th><th>Path</th><th>What</th><th>${esc(BASE)}</th><th>${cn}</th></tr></thead><tbody>` +
		d.comps.slice(0, 300).map(x => `<tr><td>${esc(x.c)}${x.n ? ` <span class="muted">'${esc(x.n)}'</span>` : ""}${x.t ? ` <span class="muted">${esc(x.t)}</span>` : ""}</td><td class="mono">${esc(x.p)}</td><td>${esc(WHAT[x.what] || x.what)}</td><td class="mono">${esc(fmt(x.ref))}</td><td class="mono">${esc(fmt(x.cand))}</td></tr>`).join("") +
		`</tbody></table></div>${d.comps.length > 300 ? `<div class="muted">${num(d.comps.length - 300)} more not shown.</div>` : ""}</details>`;
	if (d.error) extra += `<div class="shots"><div class="shot" style="flex:1 1 300px"><div class="label">${esc(BASE)}</div><pre class="err">${esc(d.error.ref || "no error")}</pre></div><div class="shot" style="flex:1 1 300px"><div class="label">${cn}</div><pre class="err">${esc(d.error.cand || "no error")}</pre></div></div>`;
	return `<article class="card c-${it.st}" data-key="${esc(key)}">
		<div class="card-head"><div class="card-title"><b>${esc(s.title || s.id)}</b>
			<span>${it.i < s.steps.length ? `Step ${it.i + 1} of ${s.steps.length}: ${esc(s.steps[it.i])}` : "The GUI as a whole"}</span>
			<span class="where">${esc(s.id)} · ${esc(laf)} · ${esc(jdk)} / ${esc(cfg)}</span></div>
			<div class="seg small" role="group" aria-label="View of this snapshot">${MODES.map(([v, l]) => `<button data-card-mode="${v}" aria-pressed="${mode === v}">${l}</button>`).join("")}</div></div>
		<div class="stats">${stats}</div>${body}${extra}</article>`;
}
const WHAT = {b: "bounds x, y, w, h", min: "minimum size", pref: "preferred size", c: "class", t: "text", hidden: "hidden", size: "window size"};
function fmt(v) { return Array.isArray(v) ? v.join(", ") : v === undefined || v === null ? "–" : String(v) }

$("#cards").addEventListener("click", e => {
	const b = e.target.closest("button[data-card-mode]"); if (!b) return;
	const art = b.closest("article");
	perCard[art.dataset.key] = b.dataset.cardMode;
	const it = items().find(x => `${f.cand.value}|${x.ci}|${x.si}|${x.i}` === art.dataset.key);
	if (!it) return;
	const tmp = document.createElement("div");
	tmp.innerHTML = card(it);
	const fresh = tmp.firstElementChild;
	art.replaceWith(fresh);
	fresh.querySelectorAll("img[data-zoom]").forEach(zoomed);
	startBlink();
});

let blinkTimer = null;
function startBlink() {
	clearInterval(blinkTimer);
	if (!document.querySelector(".blink")) return;
	let on = false;
	blinkTimer = setInterval(() => {
		on = !on;
		for (const el of document.querySelectorAll(".blink")) {
			const im = el.querySelector("img"); if (!im) continue;
			im.src = on ? el.dataset.b : el.dataset.a;
			el.parentElement.querySelector(".blinkcap").textContent = on ? el.dataset.bn : el.dataset.an;
		}
	}, 650);
}

// ---------------------------------------------------------------- baseline probe (only with --probe-baselines)
function renderProbe() {
	const p = R.probe || {}, builds = Object.keys(p);
	if (!builds.length) return;
	const el = $("#probe"); el.hidden = false;
	const keys = [...new Set(builds.flatMap(b => Object.keys(p[b])))].sort();
	let h = `<div style="display:grid;gap:4px;max-width:80ch"><h2>Baseline probe</h2>
		<div class="muted">Every component was asked for its baseline through the build's <code>SwingComponentWrapper</code>, at six sizes in 24 random orders. A component is listed when one size got two different answers: its baseline depends on earlier calls, so a layout must not remember it. “Remembered” counts the listed components that the build's <code>isBaselineCacheable()</code> would remember anyway.</div></div>
		<div class="scroll"><table class="diffs"><thead><tr><th>JDK | look and feel</th>${builds.map(b => `<th>${esc(b)}</th>`).join("")}</tr></thead><tbody>` +
		keys.map(k => `<tr><td class="mono">${esc(k)}</td>${builds.map(b => { const r = p[b][k]; if (!r) return "<td>–</td>";
			const unsafe = r.impure.filter(x => x.cacheable === "true").length, known = r.impure.some(x => x.cacheable !== "n/a");
			return `<td>${num(r.impureCount)} of ${num(r.probed)} ${known ? `<span class="chip s-${unsafe ? "layout" : "same"}">${unsafe} remembered</span>` : ""}</td>` }).join("")}</tr>`).join("") +
		`</tbody></table></div>`;
	for (const b of builds) {
		const rows = Object.entries(p[b]).flatMap(([k, r]) => (r?.impure || []).map(x => [k, x]));
		if (!rows.length) continue;
		h += `<details><summary>${esc(b)}: ${num(rows.length)} components whose baseline depends on earlier calls</summary><div class="scroll"><table class="diffs"><thead><tr><th>JDK | LaF</th><th>Scenario</th><th>Component</th><th>Remembered?</th><th>Size → answers</th></tr></thead><tbody>` +
			rows.slice(0, 800).map(([k, x]) => `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(x.scenario)}</td><td>${esc(x.component)}</td><td>${x.cacheable === "true" ? `<span class="chip s-layout">yes, unsafe</span>` : x.cacheable === "false" ? `<span class="chip s-same">no</span>` : `<span class="muted">${esc(x.cacheable)}</span>`}</td><td class="mono">${esc(x.finding)}</td></tr>`).join("") + `</tbody></table></div></details>`;
	}
	el.innerHTML = h;
}

$("#footer").innerHTML = `Compared per step: the bounds of every component, the minimum and preferred size of every MigLayout container, errors, and the screenshot pixel by pixel. ` +
	`Configs: ${Object.entries(M.configs).map(([k, v]) => `<code>${esc(k)}</code> ${v ? esc(v) : "(no flags)"}`).join("; ")}.`;

renderOverview();
renderCards();
renderProbe();
</script>
</body>
</html>
